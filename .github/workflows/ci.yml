name: CI Pipeline (Lint & Test)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check src tests scripts load_tests

      - name: Check Black code formatting
        run: black --check src tests scripts load_tests

      - name: Run pytest suite (Auth, RBAC, IDOR, MVP)
        env:
          APP_ENV: sandbox
          DEBUG: "true"
        run: pytest
