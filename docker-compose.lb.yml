# Lab 6: Horizontal Scaling (3 Backend Replicas) + Nginx Load Balancer
# Usage: docker compose -f docker-compose.lb.yml up --build

services:
  db:
    image: postgres:16-alpine
    container_name: space_lb_db
    restart: unless-stopped
    env_file:
      - config/.env.docker
    volumes:
      - postgres_lb_data:/var/lib/postgresql/data
    networks:
      - space_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app1:
    build: .
    container_name: space_app1
    restart: unless-stopped
    env_file:
      - config/.env.docker
    environment:
      INSTANCE_NAME: app1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - space_net

  app2:
    build: .
    container_name: space_app2
    restart: unless-stopped
    env_file:
      - config/.env.docker
    environment:
      INSTANCE_NAME: app2
    depends_on:
      db:
        condition: service_healthy
    networks:
      - space_net

  app3:
    build: .
    container_name: space_app3
    restart: unless-stopped
    env_file:
      - config/.env.docker
    environment:
      INSTANCE_NAME: app3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - space_net

  nginx:
    image: nginx:1.27-alpine
    container_name: space_nginx_lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - space_net

volumes:
  postgres_lb_data:

networks:
  space_net:
    driver: bridge
