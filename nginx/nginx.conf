# Lab 6: Nginx Reverse Proxy & Load Balancer (Round Robin + Passive Health Checks)

upstream space_backend {
    # Default algorithm: Round Robin
    server app1:8000 max_fails=2 fail_timeout=10s;
    server app2:8000 max_fails=2 fail_timeout=10s;
    server app3:8000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://space_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Automatic Failover to healthy replicas
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
